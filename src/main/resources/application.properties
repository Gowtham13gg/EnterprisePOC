spring.datasource.url=jdbc:h2:mem:accountdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Encryption Configuration
# In production, these would be set as environment variables
# Sample keys should be generated and stored securely
encryption.privateKey=${ENCRYPTION_PRIVATE_KEY:}
encryption.publicKey=${ENCRYPTION_PUBLIC_KEY:}

# RestTemplate Configuration
spring.main.allow-bean-definition-overriding=true
